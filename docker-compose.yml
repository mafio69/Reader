services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./logs:/var/log/app
    environment:
      - PHP_IDE_CONFIG=serverName=Docker
      - TZ=Europe/Warsaw
      - ENVIRONMENT=dev
      - APP_ENV=dev
      - PHP_ENV=dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge